name: Examples

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
  pull_request:
  # Weekly on the newest interpreter, devices and kernel, so an example that
  # stops building is found before someone copies it.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: The newest wasm-rtos (scheduled runs)
        if: github.event_name == 'schedule'
        run: |
          git submodule update --init --remote wasm-rtos
          git -C wasm-rtos submodule update --init --recursive

      # Programs are built by the WASI SDK, checked against its digest; hosts by the runner's cc.
      - name: Install the toolchains
        env:
          WASI_SDK_VERSION: "34"
          WASI_SDK_SHA256: b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4
        run: |
          archive="wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux.tar.gz"
          sdk="$RUNNER_TEMP/wasi-sdk"
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/$archive"
          echo "$WASI_SDK_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$sdk"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$sdk" --strip-components=1
          {
            echo "WASM_CC=$sdk/bin/clang"
            echo "WASI_SYSROOT=$sdk/share/wasi-sysroot"
          } >> "$GITHUB_ENV"
          sudo apt-get install -y gcc-avr avr-libc >/dev/null

      # Programs built by the pinned SDK, never the committed copies (STRICT).
      - name: Build and run every example
        run: STRICT=1 ./build.sh --save

      # The .wasm next to each source is what people without a WebAssembly
      # toolchain run: main keeps them as this SDK builds them (as the tests
      # repository keeps its programs). Pull requests only say when they differ.
      - name: Keep the built programs next to their sources
        run: |
          git add -A -- '*.wasm'
          if git diff --cached --quiet; then
            echo "The committed programs are as built"
            exit 0
          fi
          git diff --cached --stat
          if [ "${{ github.event_name }}" != "push" ] || [ "${{ github.ref_name }}" != "main" ]; then
            echo "::notice::Programs differ from the committed .wasm; main will refresh them"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Programs rebuilt by the pinned WASI SDK"
          git push origin HEAD:main
